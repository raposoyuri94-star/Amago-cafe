name: Website checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Install Chrome and browser dependencies
        run: npx playwright install --with-deps chrome

      - name: Run desktop and mobile browser tests
        run: npm run test:e2e

      - name: Upload test report and screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: browser-test-results
          path: |
            playwright-report/
            test-results/
            artifacts/*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload production website
        uses: actions/upload-artifact@v5
        with:
          name: website-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14
