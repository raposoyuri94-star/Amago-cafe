name: Website checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build
        env:
          VITE_BASE_PATH: /Amago-cafe/

      - name: Install Chrome and browser dependencies
        run: npx playwright install --with-deps chrome

      - name: Run desktop and mobile browser tests
        run: npm run test:e2e
        env:
          PLAYWRIGHT_BASE_PATH: /Amago-cafe/
          PLAYWRIGHT_PREVIEW: '1'
          VITE_BASE_PATH: /Amago-cafe/

      - name: Upload test report and screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: browser-test-results
          path: |
            playwright-report/
            test-results/
            artifacts/*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload GitHub Pages website
        if: github.ref == 'refs/heads/amago' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

      - name: Upload production website
        uses: actions/upload-artifact@v5
        with:
          name: website-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Publish GitHub Pages
    needs: build-and-test
    if: github.ref == 'refs/heads/amago' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v5
